AWSTemplateFormatVersion: '2010-09-09'
Description: Scalable web app - 2-AZ VPC, ALB + WAF, EC2 Auto Scaling, RDS Multi-AZ, CloudFront, Route 53, SSM, CloudWatch + SNS.

Parameters:
  ProjectName:
    Type: String
    Default: webapp
    AllowedPattern: '^(?!internal)[a-z](?:-?[a-z0-9])+$'
    MaxLength: 19
    Description: Lowercase prefix for resource names.
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Email address subscribed to the alarm topic (confirm the subscription email).
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    Description: /16 VPC range. Subnets are carved out as /24s.
  NatGatewayMode:
    Type: String
    Default: PerAZ
    AllowedValues: [PerAZ, Single]
    Description: PerAZ survives an AZ outage; Single halves NAT cost for dev/test.
  EnableSsmVpcEndpoints:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create interface endpoints so Session Manager traffic never leaves the VPC.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t3a.micro, t3a.small, t3a.medium, m6i.large]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AsgMinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: At least 2 so each AZ always has an instance.
  AsgMaxSize:
    Type: Number
    Default: 6
    MinValue: 2
  CpuTargetPercent:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90
  RequestsPerTarget:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: Target tracking value for ALB requests per instance per minute.
  DBEngineVersion:
    Type: String
    Default: '17'
    Description: PostgreSQL major version; RDS picks the preferred minor version.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro, db.t4g.small, db.m6g.large]
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  DBName:
    Type: String
    Default: appdb
    AllowedPattern: '^[a-z][a-z0-9_]{0,30}$'
  DBMasterUsername:
    Type: String
    Default: dbadmin
    AllowedPattern: '^[a-z][a-z0-9_]{0,15}$'
  DBDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to true for real production; it blocks stack deletion.
  DomainName:
    Type: String
    Default: ''
    Description: Optional, e.g. app.example.com. Enables HTTPS (ACM) and a Route 53 alias record.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 public hosted zone that owns DomainName (required with DomainName).

Rules:
  DomainNeedsHostedZone:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, '']]
        AssertDescription: HostedZoneId is required when DomainName is set.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  NatPerAZ: !Equals [!Ref NatGatewayMode, PerAZ]
  CreateSsmEndpoints: !Equals [!Ref EnableSsmVpcEndpoints, 'true']
  # Route 53 health check metrics are only published in us-east-1.
  IsUsEast1: !Equals [!Ref 'AWS::Region', us-east-1]

Resources:
  # ---------------------------------------------------------------- Network
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc'}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-igw'}]

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Subnets: x.x.0/1 public, x.x.10/11 private app, x.x.20/21 private data (A/B).
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-a'}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-b'}]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-a'}]
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-b'}]
  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [20, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-a'}]
  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [21, !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-rt'}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEipA.AllocationId
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-a'}]
  NatEipB:
    Type: AWS::EC2::EIP
    Condition: NatPerAZ
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAZ
    Properties:
      SubnetId: !Ref PublicSubnetB
      AllocationId: !GetAtt NatEipB.AllocationId
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-b'}]

  # One app route table per AZ so each AZ egresses through its own NAT gateway.
  AppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-rt-a'}]
  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  AppSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTableA}
  AppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-rt-b'}]
  AppDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAZ, !Ref NatGatewayB, !Ref NatGatewayA]
  AppSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetB, RouteTableId: !Ref AppRouteTableB}

  # Data tier has no route to the internet at all.
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-rt'}]
  DbSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnetA, RouteTableId: !Ref DbRouteTable}
  DbSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnetB, RouteTableId: !Ref DbRouteTable}

  # Free gateway endpoint: dnf repos and S3 traffic bypass the NAT gateway.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [!Ref AppRouteTableA, !Ref AppRouteTableB]

  # ---------------------------------------------------------------- NACLs (stateless: allow replies explicitly)
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-nacl'}]
  PublicNaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 80, To: 80}}
  PublicNaclInHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 443, To: 443}}
  PublicNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref PublicNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  PublicNaclOut:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Egress: true, Protocol: -1, RuleAction: allow, CidrBlock: 0.0.0.0/0}
  PublicNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNacl}
  PublicNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNacl}

  AppNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-nacl'}]
  AppNaclInHttpA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt PublicSubnetA.CidrBlock, PortRange: {From: 80, To: 80}}
  AppNaclInHttpB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt PublicSubnetB.CidrBlock, PortRange: {From: 80, To: 80}}
  AppNaclInEndpoints:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: !Ref VpcCidr, PortRange: {From: 443, To: 443}}
  AppNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  AppNaclOut:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 100, Egress: true, Protocol: -1, RuleAction: allow, CidrBlock: 0.0.0.0/0}
  AppNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AppSubnetA, NetworkAclId: !Ref AppNacl}
  AppNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AppSubnetB, NetworkAclId: !Ref AppNacl}

  # Data tier: PostgreSQL from the app subnets only; DB subnets may reach each other (primary/standby).
  DbNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-nacl'}]
  DbNaclInPgA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt AppSubnetA.CidrBlock, PortRange: {From: 5432, To: 5432}}
  DbNaclInPgB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt AppSubnetB.CidrBlock, PortRange: {From: 5432, To: 5432}}
  DbNaclInPeerA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 110, Protocol: -1, RuleAction: allow, CidrBlock: !GetAtt DbSubnetA.CidrBlock}
  DbNaclInPeerB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 111, Protocol: -1, RuleAction: allow, CidrBlock: !GetAtt DbSubnetB.CidrBlock}
  DbNaclOutAppA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 100, Egress: true, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt AppSubnetA.CidrBlock, PortRange: {From: 1024, To: 65535}}
  DbNaclOutAppB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 101, Egress: true, Protocol: 6, RuleAction: allow, CidrBlock: !GetAtt AppSubnetB.CidrBlock, PortRange: {From: 1024, To: 65535}}
  DbNaclOutPeerA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 110, Egress: true, Protocol: -1, RuleAction: allow, CidrBlock: !GetAtt DbSubnetA.CidrBlock}
  DbNaclOutPeerB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DbNacl, RuleNumber: 111, Egress: true, Protocol: -1, RuleAction: allow, CidrBlock: !GetAtt DbSubnetB.CidrBlock}
  DbNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DbSubnetA, NetworkAclId: !Ref DbNacl}
  DbNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DbSubnetB, NetworkAclId: !Ref DbNacl}

  # ---------------------------------------------------------------- Security groups: internet -> ALB -> app -> DB
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP/HTTPS from the internet, HTTP to app instances only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, DestinationSecurityGroupId: !Ref AppSecurityGroup, Description: To app}
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-alb-sg'}]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances - HTTP from the ALB only; no SSH (Session Manager instead)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: AWS APIs and package repos}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Package repos}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup, Description: PostgreSQL}
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app-sg'}]
  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: HTTP from ALB

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - PostgreSQL from app instances only
      VpcId: !Ref VPC
      # An explicit egress rule removes the default allow-all egress.
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 127.0.0.1/32, Description: No outbound}
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-sg'}]
  DbIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: PostgreSQL from app

  # ---------------------------------------------------------------- Session Manager endpoints (optional)
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSsmEndpoints
    Properties:
      GroupDescription: Interface endpoints - HTTPS from app instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: HTTPS from app}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 127.0.0.1/32, Description: No outbound}
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ---------------------------------------------------------------- Database
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private data subnets in two AZs
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      # RDS generates and rotates the password in Secrets Manager; it never appears in the template.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: !Ref DBDeletionProtection
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db'}]

  # ---------------------------------------------------------------- Static assets: S3 (private) behind CloudFront
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${StaticBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt StaticBucket.Arn, !Sub '${StaticBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}

  StaticOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-static-oac-${AWS::Region}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} static assets'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: static-s3
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt StaticOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: static-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy

  # ---------------------------------------------------------------- Compute
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/app'
      RetentionInDays: 14

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        Monitoring: {Enabled: true}
        MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1}
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 10, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: !Sub '${ProjectName}-app'}]
          - ResourceType: volume
            Tags: [{Key: Name, Value: !Sub '${ProjectName}-app'}]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # First-boot bootstrap. Output: /var/log/cloud-init-output.log
            set -euxo pipefail

            dnf install -y python3-pip
            useradd --system --shell /sbin/nologin webapp
            mkdir -p /opt/webapp /var/log/webapp
            python3 -m venv /opt/webapp/venv
            for attempt in 1 2 3 4 5; do
              /opt/webapp/venv/bin/pip install --quiet boto3 'psycopg2-binary<3' && break
              sleep 15
            done

            cat > /etc/webapp.env <<'EOF'
            DB_HOST=${Database.Endpoint.Address}
            DB_PORT=${Database.Endpoint.Port}
            DB_NAME=${DBName}
            DB_SECRET_ARN=${Database.MasterUserSecret.SecretArn}
            STATIC_BASE_URL=https://${CloudFrontDistribution.DomainName}/static
            AWS_DEFAULT_REGION=${AWS::Region}
            EOF

            cat > /opt/webapp/app.py <<'EOF'
            """Demo app: shows which instance/AZ served the request and checks RDS connectivity."""
            import html
            import json
            import logging
            import os
            import time
            import urllib.request
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

            logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
            log = logging.getLogger("webapp")
            STATIC = os.environ.get("STATIC_BASE_URL", "/static")
            _creds = {"value": None, "expires": 0.0}

            PAGE = """<!doctype html>
            <html lang="en"><head><meta charset="utf-8"><title>Scalable Web App</title>
            <link rel="stylesheet" href="{static}/style.css"></head>
            <body><main>
            <img src="{static}/logo.svg" alt="" width="64" height="64">
            <h1>Scalable Web Application</h1>
            <p>Served by instance <code>{instance}</code> in Availability Zone <code>{az}</code>.</p>
            <p>Refresh to watch the load balancer spread requests across Availability Zones.</p>
            <p><a href="/db">Check database connectivity</a></p>
            </main></body></html>
            """


            def imds(path):
                """Instance metadata via IMDSv2 (the launch template requires session tokens)."""
                base = "http://169.254.169.254/latest/"
                try:
                    req = urllib.request.Request(base + "api/token", method="PUT",
                                                 headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
                    token = urllib.request.urlopen(req, timeout=1).read().decode()
                    req = urllib.request.Request(base + "meta-data/" + path,
                                                 headers={"X-aws-ec2-metadata-token": token})
                    return urllib.request.urlopen(req, timeout=1).read().decode()
                except OSError:
                    return "unknown"


            INSTANCE_ID = imds("instance-id")
            AZ = imds("placement/availability-zone")


            def db_credentials(refresh=False):
                # RDS rotates the managed master password: cache briefly, refetch on auth failure.
                if refresh or time.time() > _creds["expires"]:
                    import boto3
                    secret = boto3.client("secretsmanager").get_secret_value(
                        SecretId=os.environ["DB_SECRET_ARN"])
                    _creds["value"] = json.loads(secret["SecretString"])
                    _creds["expires"] = time.time() + 300
                return _creds["value"]


            def query_db():
                import psycopg2
                for attempt in range(2):
                    creds = db_credentials(refresh=attempt > 0)
                    try:
                        conn = psycopg2.connect(
                            host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT", "5432")),
                            dbname=os.environ["DB_NAME"], user=creds["username"],
                            password=creds["password"], sslmode="require", connect_timeout=3)
                        break
                    except psycopg2.OperationalError:
                        if attempt:
                            raise
                try:
                    with conn.cursor() as cur:
                        cur.execute("SELECT version(), host(inet_server_addr()), now()")
                        version, server_ip, now = cur.fetchone()
                finally:
                    conn.close()
                return {"status": "ok", "server_ip": server_ip, "version": version,
                        "db_time": now.isoformat()}


            class Handler(BaseHTTPRequestHandler):
                server_version = "webapp"
                sys_version = ""

                def do_GET(self):
                    path = self.path.split("?", 1)[0]
                    if path == "/health":
                        self.reply(200, "text/plain", "ok")
                    elif path == "/":
                        self.reply(200, "text/html; charset=utf-8", PAGE.format(
                            static=html.escape(STATIC), instance=html.escape(INSTANCE_ID),
                            az=html.escape(AZ)))
                    elif path == "/db":
                        try:
                            result, code = query_db(), 200
                        except Exception:
                            log.exception("database check failed")
                            result, code = {"status": "error", "detail": "database unavailable"}, 503
                        result["instance"] = INSTANCE_ID
                        self.reply(code, "application/json", json.dumps(result))
                    else:
                        self.reply(404, "text/plain", "not found")

                def reply(self, code, content_type, body):
                    data = body.encode()
                    self.send_response(code)
                    self.send_header("Content-Type", content_type)
                    self.send_header("Content-Length", str(len(data)))
                    self.send_header("Cache-Control", "no-store")
                    self.send_header("X-Content-Type-Options", "nosniff")
                    self.end_headers()
                    self.wfile.write(data)

                def log_message(self, fmt, *args):
                    if not self.path.startswith("/health"):
                        client = self.headers.get("X-Forwarded-For", self.client_address[0])
                        log.info("%s %s", client, fmt % args)


            if __name__ == "__main__":
                address = (os.environ.get("HOST", "0.0.0.0"), int(os.environ.get("PORT", "80")))
                log.info("listening on %s:%s (instance %s, %s)", *address, INSTANCE_ID, AZ)
                ThreadingHTTPServer(address, Handler).serve_forever()
            EOF

            cat > /etc/systemd/system/webapp.service <<'EOF'
            [Unit]
            Description=Demo web application
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=webapp
            EnvironmentFile=/etc/webapp.env
            ExecStart=/opt/webapp/venv/bin/python /opt/webapp/app.py
            AmbientCapabilities=CAP_NET_BIND_SERVICE
            Restart=always
            StandardOutput=append:/var/log/webapp/app.log
            StandardError=append:/var/log/webapp/app.log

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/logrotate.d/webapp <<'EOF'
            /var/log/webapp/app.log {
              daily
              rotate 7
              compress
              missingok
              copytruncate
            }
            EOF

            chown -R webapp:webapp /opt/webapp /var/log/webapp
            systemctl daemon-reload
            systemctl enable --now webapp

            # CloudWatch agent: memory/disk metrics and app log shipping. Non-fatal.
            if dnf install -y amazon-cloudwatch-agent; then
              cat > /opt/aws/amazon-cloudwatch-agent/etc/webapp.json <<'EOF'
            {
              "metrics": {
                "append_dimensions": {"AutoScalingGroupName": "${!aws:AutoScalingGroupName}", "InstanceId": "${!aws:InstanceId}"},
                "aggregation_dimensions": [["AutoScalingGroupName"]],
                "metrics_collected": {
                  "mem": {"measurement": ["mem_used_percent"]},
                  "disk": {"measurement": ["used_percent"], "resources": ["/"]}
                }
              },
              "logs": {"logs_collected": {"files": {"collect_list": [
                {"file_path": "/var/log/webapp/app.log", "log_group_name": "${AppLogGroup}", "log_stream_name": "{instance_id}"}
              ]}}}
            }
            EOF
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/webapp.json || echo "CloudWatch agent failed to start"
            fi

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Instances install packages at boot, so the NAT routes must be in effect first.
    DependsOn: [AppDefaultRouteA, AppDefaultRouteB, AppSubnetARouteTable, AppSubnetBRouteTable]
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-asg'
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      MetricsCollection: [{Granularity: 1Minute}]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-app', PropagateAtLaunch: true}]
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M

  # Primary policy: keep average CPU near the target.
  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 180
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
        TargetValue: !Ref CpuTargetPercent

  # Second target: requests per instance, so I/O-bound traffic also scales out.
  RequestCountTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    # TG must be on the serving listener first (StaticRedirectRule refs HTTP or HTTPS).
    DependsOn: [HttpListener, StaticRedirectRule]
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 180
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ['/', [!GetAtt ALB.LoadBalancerFullName, !GetAtt TargetGroup.TargetGroupFullName]]
        TargetValue: !Ref RequestsPerTarget

  # Burst policy: add capacity in bigger steps when CPU spikes (scale-in is left to target tracking).
  CpuStepScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      MetricAggregationType: Average
      EstimatedInstanceWarmup: 180
      StepAdjustments:
        - {MetricIntervalLowerBound: 0, MetricIntervalUpperBound: 10, ScalingAdjustment: 1}
        - {MetricIntervalLowerBound: 10, ScalingAdjustment: 2}

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ASG CPU >= 80% for 2 minutes - step scale-out (+1 at 80%, +2 at 90%)
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: AutoScalingGroupName, Value: !Ref AutoScalingGroup}]
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref CpuStepScaleOutPolicy, !Ref AlertsTopic]

  # ---------------------------------------------------------------- Load balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VpcGatewayAttachment
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-tg'
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: [{DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}]

  # With a domain: HTTP redirects to HTTPS. Without one: HTTP serves the app directly.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions: !If
        - HasDomain
        - [{Type: redirect, RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}}]
        - [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasDomain
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref Certificate}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  # Layer 7 rules on the serving listener.
  StaticRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasDomain, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10
      Conditions: [{Field: path-pattern, PathPatternConfig: {Values: ['/static/*']}}]
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Host: !GetAtt CloudFrontDistribution.DomainName
            Port: '443'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  AdminBlockRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasDomain, !Ref HttpsListener, !Ref HttpListener]
      Priority: 20
      Conditions: [{Field: path-pattern, PathPatternConfig: {Values: [/admin, '/admin/*']}}]
      Actions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}

  # ---------------------------------------------------------------- AWS WAF
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-web-acl'
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub '${ProjectName}-web-acl'}
      Rules:
        - Name: IpReputation
          Priority: 0
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: IpReputation}
        - Name: RateLimitPerIp
          Priority: 1
          Action: {Block: {}}
          Statement: {RateBasedStatement: {Limit: 2000, AggregateKeyType: IP}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: RateLimitPerIp}
        # OWASP Top 10 core rules
        - Name: CommonRuleSet
          Priority: 2
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: CommonRuleSet}
        - Name: KnownBadInputs
          Priority: 3
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: KnownBadInputs}
        - Name: SQLi
          Priority: 4
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: SQLi}

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ALB
      WebACLArn: !GetAtt WebACL.Arn

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-${ProjectName}'   # prefix required by AWS WAF
      RetentionInDays: 30

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebACL.Arn
      LogDestinationConfigs: [!Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}']

  # ---------------------------------------------------------------- DNS
  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ALB.DNSName
        HostedZoneId: !GetAtt ALB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # Probes the app from Route 53 locations worldwide (custom domain if set, else the ALB name).
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: !If [HasDomain, HTTPS, HTTP]
        FullyQualifiedDomainName: !If [HasDomain, !Ref DomainName, !GetAtt ALB.DNSName]
        Port: !If [HasDomain, 443, 80]
        ResourcePath: /health
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags: [{Key: Name, Value: !Sub '${ProjectName}-app'}]

  # ---------------------------------------------------------------- Monitoring and alerting
  # Unencrypted on purpose: CloudWatch alarms cannot publish to a topic encrypted with alias/aws/sns.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub '${ProjectName} alerts'
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least one target failing ALB health checks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: App returned more than 10 HTTP 5xx in 5 minutes
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ALB itself returned more than 10 HTTP 5xx in 5 minutes (e.g. no healthy targets)
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions: [{Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 target response time above 1 second for 3 minutes
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions: [{Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}]
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS CPU above 80% for 10 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS free storage below 2 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  HealthCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsUsEast1
    Properties:
      AlarmDescription: Route 53 health check reports the application unreachable
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions: [{Name: HealthCheckId, Value: !Ref HealthCheck}]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${AWS::Region}'
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "ALB requests and 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
            "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ALB.LoadBalancerFullName}"],
                        [".", "HTTPCode_Target_5XX_Count", ".", "."], [".", "HTTPCode_ELB_5XX_Count", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Target response time p95 (s)", "region": "${AWS::Region}", "stat": "p95", "period": 60,
            "metrics": [["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ALB.LoadBalancerFullName}"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Target health", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
            "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${ALB.LoadBalancerFullName}"],
                        [".", "UnHealthyHostCount", ".", ".", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "ASG in-service instances and CPU", "region": "${AWS::Region}", "period": 60,
            "metrics": [["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroup}", {"stat": "Maximum"}],
                        ["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AutoScalingGroup}", {"stat": "Average", "yAxis": "right"}]]}},
          {"type": "metric", "x": 0, "y": 12, "width": 8, "height": 6, "properties": {
            "title": "Instance memory / disk used % (CloudWatch agent)", "region": "${AWS::Region}", "stat": "Average", "period": 60,
            "metrics": [["CWAgent", "mem_used_percent", "AutoScalingGroupName", "${AutoScalingGroup}"], [".", "disk_used_percent", ".", "."]]}},
          {"type": "metric", "x": 8, "y": 12, "width": 8, "height": 6, "properties": {
            "title": "RDS CPU and connections", "region": "${AWS::Region}", "stat": "Average", "period": 300,
            "metrics": [["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${Database}"], [".", "DatabaseConnections", ".", ".", {"yAxis": "right"}]]}},
          {"type": "metric", "x": 16, "y": 12, "width": 8, "height": 6, "properties": {
            "title": "WAF allowed vs blocked", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [["AWS/WAFV2", "AllowedRequests", "WebACL", "${ProjectName}-web-acl", "Region", "${AWS::Region}", "Rule", "ALL"],
                        [".", "BlockedRequests", ".", ".", ".", ".", ".", "."]]}},
          {"type": "metric", "x": 0, "y": 18, "width": 12, "height": 6, "properties": {
            "title": "CloudFront static asset requests", "region": "us-east-1", "stat": "Sum", "period": 300,
            "metrics": [["AWS/CloudFront", "Requests", "DistributionId", "${CloudFrontDistribution}", "Region", "Global"]]}},
          {"type": "metric", "x": 12, "y": 18, "width": 12, "height": 6, "properties": {
            "title": "Route 53 health check (1 = healthy)", "region": "us-east-1", "stat": "Minimum", "period": 60,
            "metrics": [["AWS/Route53", "HealthCheckStatus", "HealthCheckId", "${HealthCheck}"]]}}
        ]}

Outputs:
  AppUrl:
    Description: Application entry point
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'http://${ALB.DNSName}']
  AlbDnsName:
    Value: !GetAtt ALB.DNSName
  StaticAssetsUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}/static/'
  StaticBucketName:
    Description: Upload ./static here (aws s3 sync static s3://BUCKET/static)
    Value: !Ref StaticBucket
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}'
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  WebAclArn:
    Value: !GetAtt WebACL.Arn
  HealthCheckId:
    Value: !Ref HealthCheck
